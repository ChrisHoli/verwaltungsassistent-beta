services:
  momo:
    build:
      context: .
      args:
        MIT_CLAUDE: ${MIT_CLAUDE:-0}
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: Europe/Berlin
    volumes:
      - ./daten:/daten
    # Kein Port nach außen: Momo spricht nur über Delta Chat.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 2g  # Whisper small braucht beim Zuhören etwa 700 MB
