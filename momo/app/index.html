<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Momo</title>
<script src="webxdc.js"></script>
<style>
  @font-face { font-family: "Atkinson"; src: url("schriften/atkinson-hyperlegible-400.woff2") format("woff2"); font-weight: 400; }
  @font-face { font-family: "Atkinson"; src: url("schriften/atkinson-hyperlegible-700.woff2") format("woff2"); font-weight: 700; }
  @font-face { font-family: "Lexend"; src: url("schriften/lexend-400.woff2") format("woff2"); font-weight: 400; }
  @font-face { font-family: "Lexend"; src: url("schriften/lexend-700.woff2") format("woff2"); font-weight: 700; }
  @font-face { font-family: "OpenDyslexic"; src: url("schriften/opendyslexic-400.woff2") format("woff2"); font-weight: 400; }
  @font-face { font-family: "OpenDyslexic"; src: url("schriften/opendyslexic-700.woff2") format("woff2"); font-weight: 700; }

  :root {
    --grund: #fbf7ef; --karte: #ffffff; --text: #1f1d1a; --leise: #5b5650; --linie: #e4ddd0;
    --akzent: #2f6f5e; --akzent-text: #ffffff; --warn: #9a4b00; --warn-grund: #fff1df;
    --schrift: "Atkinson", system-ui, sans-serif; --groesse: 21px;
  }
  @media (prefers-color-scheme: dark) {
    :root { --grund: #1c1b19; --karte: #272522; --text: #f2eee6; --leise: #b9b2a6; --linie: #3a3732;
            --akzent: #7cc4ad; --akzent-text: #10201b; --warn: #ffb870; --warn-grund: #3a2a17; }
  }
  * { box-sizing: border-box; }
  html { font-size: var(--groesse); }
  body { margin: 0; background: var(--grund); color: var(--text); font-family: var(--schrift);
         line-height: 1.6; letter-spacing: 0.01em; word-spacing: 0.06em; }
  main { max-width: 40rem; margin: 0 auto; padding: 0.8rem 0.8rem 3rem; }
  h1 { font-size: 1.5rem; margin: 0.2rem 0 0.6rem; }
  h2 { font-size: 1.15rem; margin: 1.4rem 0 0.6rem; }
  button { font: inherit; color: inherit; cursor: pointer; }
  .leiste { display: flex; gap: 0.4rem; flex-wrap: wrap; align-items: center; margin-bottom: 0.4rem; }
  .klein { font-size: 0.85rem; padding: 0.35rem 0.7rem; border-radius: 0.6rem; border: 2px solid var(--linie);
           background: var(--karte); }
  .klein[aria-pressed="true"] { border-color: var(--akzent); font-weight: 700; }
  .kachel { display: block; width: 100%; text-align: left; background: var(--karte); border: 2px solid var(--linie);
            border-radius: 1rem; padding: 0.9rem 1rem; margin: 0 0 0.7rem; }
  .kachel.frist { border-color: var(--warn); background: var(--warn-grund); }
  .zeile { display: flex; gap: 0.8rem; align-items: center; }
  .symbol { font-size: 2rem; line-height: 1; flex: none; width: 2.4rem; text-align: center; }
  .gross { font-size: 1.15rem; font-weight: 700; }
  .leise { color: var(--leise); font-size: 0.9rem; }
  .knoepfe { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-top: 0.7rem; }
  .knopf { flex: 1 1 9rem; min-height: 3.2rem; border-radius: 0.8rem; border: 2px solid var(--akzent);
           background: var(--karte); font-weight: 700; padding: 0.4rem 0.8rem; }
  .knopf.voll { background: var(--akzent); color: var(--akzent-text); }
  .raster { display: grid; grid-template-columns: repeat(auto-fill, minmax(7rem, 1fr)); gap: 0.7rem; }
  .raster .kachel { margin: 0; text-align: center; }
  .raster .symbol { width: auto; margin-bottom: 0.3rem; }
  .zurueck { margin: 0.2rem 0 0.8rem; }
  .meldung { position: fixed; left: 0.8rem; right: 0.8rem; bottom: 0.8rem; background: var(--akzent);
             color: var(--akzent-text); border-radius: 0.8rem; padding: 0.8rem 1rem; font-weight: 700;
             display: none; max-width: 40rem; margin: 0 auto; }
  .leer { color: var(--leise); }
  dl { margin: 0; } dt { font-weight: 700; margin-top: 0.7rem; } dd { margin: 0; }
</style>
</head>
<body>
<main>
  <div class="leiste" role="group" aria-label="Schrift">
    <button class="klein" data-schrift="Atkinson">Schrift 1</button>
    <button class="klein" data-schrift="Lexend" style="font-family: Lexend">Schrift 2</button>
    <button class="klein" data-schrift="OpenDyslexic" style="font-family: OpenDyslexic">Schrift 3</button>
    <button class="klein" id="kleiner" aria-label="Kleiner">A−</button>
    <button class="klein" id="groesser" aria-label="Größer">A+</button>
  </div>
  <div id="inhalt"><p class="leer">Einen Moment. Momo schickt gleich deine Briefe.</p></div>
</main>
<div class="meldung" id="meldung" role="status"></div>

<script>
"use strict";
const SYMBOLE = {
  "Amt und Behörde": "🏛️", "Gesundheit": "🩺", "Versicherung": "🛡️", "Bank und Geld": "🏦", "Wohnen": "🏠",
  "Arbeit": "💼", "Rechnungen und Verträge": "🧾", "Steuern": "📊", "Familie und Schule": "👪",
  "Sonstiges": "📁", "Zum Prüfen": "⚠️",
};
const MONATE = ["Januar", "Februar", "März", "April", "Mai", "Juni", "Juli", "August", "September", "Oktober",
                "November", "Dezember"];
let stand = null;
let ansicht = { art: "start" };

function lesbar(iso) {
  if (!iso) return "";
  const [j, m, t] = iso.split("-").map(Number);
  return `${t}. ${MONATE[m - 1]} ${j}`;
}
function tageBis(iso) {
  const heute = new Date(); heute.setHours(0, 0, 0, 0);
  const [j, m, t] = iso.split("-").map(Number);
  return Math.round((new Date(j, m - 1, t) - heute) / 86400000);
}
function wann(iso) {
  const n = tageBis(iso);
  return n === 0 ? "Heute" : n === 1 ? "Morgen" : `In ${n} Tagen`;
}
function el(tag, attr = {}, ...kinder) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attr)) {
    if (k === "onclick") e.addEventListener("click", v); else if (k === "class") e.className = v;
    else e.setAttribute(k, v);
  }
  for (const k of kinder) if (k !== null && k !== undefined) e.append(k);
  return e;
}
function melden(text) {
  const m = document.getElementById("meldung");
  m.textContent = text; m.style.display = "block";
  clearTimeout(melden.uhr); melden.uhr = setTimeout(() => { m.style.display = "none"; }, 4500);
}
function bitte(was, brief, frist) {
  window.webxdc.sendUpdate({ payload: { typ: "bitte", was, brief, frist, zeit: Date.now() } }, "");
}

function fristKachel(f) {
  const b = stand.briefe[f.brief];
  const offen = f.status === "vorgeschlagen";
  return el("div", { class: "kachel frist" },
    el("div", { class: "zeile" }, el("span", { class: "symbol", "aria-hidden": "true" }, f.art === "wiedervorlage" ? "✍️" : "⏰"),
      el("div", {},
        el("div", { class: "gross" }, `${wann(f.datum)}: ${lesbar(f.datum)}`),
        el("div", {}, f.art === "wiedervorlage" ? `Widerspruch überlegen${b.absender ? " · " + b.absender : ""}`
                                                 : (b.was_tun || "Wichtiger Tag") + (b.absender ? ` · ${b.absender}` : "")),
        offen ? el("div", { class: "leise" }, "Noch nicht bestätigt") : null)),
    el("div", { class: "knoepfe" },
      el("button", { class: "knopf", onclick: () => { bitte("vorlesen", f.brief); melden("Momo schickt dir gleich eine Sprachnachricht."); } }, "🔊 Vorlesen"),
      offen ? el("button", { class: "knopf voll", onclick: () => { bitte("bestaetigen", f.brief, f.frist); melden("Gut. Momo erinnert dich."); } }, "⏰ Erinnern")
            : el("button", { class: "knopf voll", onclick: () => { bitte("erledigt", f.brief, f.frist); melden("Super. Erledigt."); } }, "✓ Erledigt")));
}

function zeigeStart() {
  const inhalt = [el("h1", {}, "Momo")];
  const fristen = stand.fristen.filter(f => tageBis(f.datum) >= 0 && tageBis(f.datum) <= 30);
  inhalt.push(el("h2", {}, "⏰ Bald wichtig"));
  if (fristen.length) fristen.forEach(f => inhalt.push(fristKachel(f)));
  else inhalt.push(el("p", { class: "leer" }, "In den nächsten 30 Tagen ist nichts zu tun."));
  inhalt.push(el("h2", {}, "📂 Meine Briefe"));
  const zaehler = {};
  stand.briefe.forEach(b => { if (b.kategorie !== "_alt") zaehler[b.kategorie] = (zaehler[b.kategorie] || 0) + 1; });
  const bereiche = Object.keys(zaehler).sort();
  if (!bereiche.length) inhalt.push(el("p", { class: "leer" }, "Noch keine Briefe. Schick Momo ein Foto von einem Brief."));
  else inhalt.push(el("div", { class: "raster" }, ...bereiche.map(k =>
    el("button", { class: "kachel", onclick: () => zeige({ art: "bereich", bereich: k }) },
      el("div", { class: "symbol", "aria-hidden": "true" }, SYMBOLE[k] || "📁"),
      el("div", { class: "gross" }, k), el("div", { class: "leise" }, zaehler[k] === 1 ? "1 Brief" : `${zaehler[k]} Briefe`)))));
  return inhalt;
}

function zeigeBereich(bereich) {
  const liste = stand.briefe.map((b, i) => ({ ...b, i })).filter(b => b.kategorie === bereich)
    .sort((a, b) => (b.datum || b.eingang).localeCompare(a.datum || a.eingang));
  return [
    el("button", { class: "klein zurueck", onclick: () => zeige({ art: "start" }) }, "← Zurück"),
    el("h1", {}, `${SYMBOLE[bereich] || "📁"} ${bereich}`),
    ...liste.map(b => el("button", { class: "kachel", onclick: () => zeige({ art: "brief", brief: b.i, bereich }) },
      el("div", { class: "gross" }, b.absender || "Unbekannt"),
      el("div", {}, b.was_ist_das || b.betreff || "Brief"),
      el("div", { class: "leise" }, lesbar(b.datum || b.eingang)))),
  ];
}

function zeigeBrief(i, bereich) {
  const b = stand.briefe[i];
  const fristen = stand.fristen.filter(f => f.brief === i);
  const teile = [
    el("button", { class: "klein zurueck", onclick: () => zeige({ art: "bereich", bereich }) }, "← Zurück"),
    el("h1", {}, b.absender || "Brief"),
    el("dl", {},
      el("dt", {}, "Was ist das?"), el("dd", {}, b.was_ist_das || b.betreff || "Das habe ich nicht sicher gefunden."),
      el("dt", {}, "Was musst du tun?"), el("dd", {}, b.was_tun || "Das habe ich nicht sicher gefunden."),
      b.datum ? el("dt", {}, "Datum vom Brief") : null, b.datum ? el("dd", {}, lesbar(b.datum)) : null,
      b.aktenzeichen ? el("dt", {}, "Nummer") : null, b.aktenzeichen ? el("dd", {}, b.aktenzeichen) : null,
      el("dt", {}, "Abgelegt unter"), el("dd", {}, b.ordner || "Eingang")),
  ];
  if (b.pruefen) teile.push(el("p", { class: "leise" }, "Bei manchen Angaben ist Momo nicht sicher. Schau bitte mit jemandem drauf."));
  fristen.forEach(f => teile.push(fristKachel(f)));
  teile.push(el("div", { class: "knoepfe" },
    el("button", { class: "knopf", onclick: () => { bitte("vorlesen", i); melden("Momo schickt dir gleich eine Sprachnachricht."); } }, "🔊 Vorlesen"),
    b.verdacht ? null : el("button", { class: "knopf voll", onclick: () => { bitte("antworten", i); melden("Momo fragt dich gleich im Chat, was im Brief stehen soll."); } }, "✍️ Antworten")));
  return teile;
}

function zeige(neu) {
  if (neu) ansicht = neu;
  const ziel = document.getElementById("inhalt");
  if (!stand) return;
  let teile;
  if (ansicht.art === "bereich") teile = zeigeBereich(ansicht.bereich);
  else if (ansicht.art === "brief" && stand.briefe[ansicht.brief]) teile = zeigeBrief(ansicht.brief, ansicht.bereich);
  else teile = zeigeStart();
  ziel.replaceChildren(...teile);
  if (neu) window.scrollTo(0, 0);
}

// Schrift und Größe merken (nur auf diesem Gerät)
function einstellen(schrift, groesse) {
  document.documentElement.style.setProperty("--schrift", `"${schrift}", system-ui, sans-serif`);
  document.documentElement.style.setProperty("--groesse", `${groesse}px`);
  document.querySelectorAll("[data-schrift]").forEach(k => k.setAttribute("aria-pressed", String(k.dataset.schrift === schrift)));
  try { localStorage.setItem("momo-schrift", JSON.stringify({ schrift, groesse })); } catch (e) { /* egal */ }
}
let wahl = { schrift: "Atkinson", groesse: 21 };
try { wahl = { ...wahl, ...JSON.parse(localStorage.getItem("momo-schrift") || "{}") }; } catch (e) { /* egal */ }
einstellen(wahl.schrift, wahl.groesse);
document.querySelectorAll("[data-schrift]").forEach(k => k.addEventListener("click", () => { wahl.schrift = k.dataset.schrift; einstellen(wahl.schrift, wahl.groesse); }));
document.getElementById("groesser").addEventListener("click", () => { wahl.groesse = Math.min(32, wahl.groesse + 2); einstellen(wahl.schrift, wahl.groesse); });
document.getElementById("kleiner").addEventListener("click", () => { wahl.groesse = Math.max(15, wahl.groesse - 2); einstellen(wahl.schrift, wahl.groesse); });

window.webxdc.setUpdateListener((update) => {
  const p = update.payload;
  if (p && p.typ === "stand") { stand = p; zeige(); }
}, 0);
</script>
</body>
</html>
